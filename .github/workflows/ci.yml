name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the postgres service below and the default in
  # apps/indexer/src/persistence/__tests__/integration/_setup.ts. The 5433 remap in
  # docs/2.0/v0.2-notes/postgres-port-5433.patch is a dev-host workaround, not a
  # project convention, so CI stays on 5432.
  DATABASE_URL: postgres://zcashreveal:zcashreveal@localhost:5432/zcashreveal
  # Matches the redis service below and the default in apps/publisher/src/config.ts.
  # THIS IS THE LOCAL REDIS AND IT IS NOT THE VERCEL-MANAGED STORE. No
  # SNAPSHOT_REDIS_* name is set anywhere in this file, deliberately:
  # docs/2.0/SNAPSHOT.md rule 5 says tests, local development and builds never
  # point at the store that is shared with an unrelated production project.
  # The publisher's A7 sink suite reaches 127.0.0.1:6379 directly rather than
  # reading this variable, so the address is stated in two places and they have
  # to agree; the suite skips itself with a named reason if nothing answers.
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zcashreveal
          POSTGRES_PASSWORD: zcashreveal
          POSTGRES_DB: zcashreveal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcashreveal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # THE PUBLISHER'S A7 SINK TEST IS THE ONLY THING IN THIS REPOSITORY THAT
      # NEEDS IT. That suite writes the three snapshot keys through the real
      # ioredis adapter, the real MULTI and the real TTL, then reads them back;
      # without a Redis on 6379 it skips itself and A7 has no integration half.
      #
      # IT IS A LOCAL REDIS AND IT CAN NEVER BE THE MANAGED ONE. The Vercel
      # store is shared with an unrelated production project, and rule 5 of
      # docs/2.0/SNAPSHOT.md keeps every test off it - which is why this service
      # exists at all rather than CI being handed a real URL.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # THE FOUR PINNED ACTIONS ARE ON node24 RUNTIMES, and the versions were
      # chosen by READING each action's own action.yml rather than by taking the
      # newest major. The HANDOFF-00 run warned that all four were being forced
      # onto Node 24; the rule applied here is "the LOWEST major whose `using:`
      # is node24", which minimises behavioural change while clearing the
      # deprecation.
      #
      # THAT RULE IS NOT THE SAME AS "BUMP ONE MAJOR", and upload-artifact is
      # why it matters: v4 and v5 are BOTH `using: node20`, so the obvious
      # one-step bump would have looked like a fix and changed nothing. Only v6
      # moves it. Read at the tag:
      #
      #   actions/checkout        v4 node20  v5 node24  <- v5
      #   actions/setup-node      v4 node20  v5 node24  <- v5
      #   actions/upload-artifact v4 node20  v5 node20  v6 node24  <- v6
      #   pnpm/action-setup       v4 node20  v5 node24  <- v5
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # THE ELEVEN STATIC GUARDS RUN BEFORE INSTALL AND BUILD, on purpose. None of
      # them needs node_modules or a build - they are bash, grep and dependency-free
      # node - and putting them after meant a PR whose build broke never got its
      # verdict on any of them. The Redis one in particular protects another
      # project's production database, and that verdict should not be contingent on
      # this repository compiling.
      - name: No emoji anywhere
        run: ./scripts/check-no-emoji.sh

      # Vercel applies a root vercel.json to every project in the repo, whatever
      # a project's Root Directory says, and it broke apps/web's first production
      # build. If the root file comes back, apps/web breaks again. See A8.
      - name: Vercel config
        run: node scripts/check-vercel-config.mjs

      # The Vercel-managed Redis is SHARED with an unrelated production project, so
      # a destructive command there is an outage for someone who never agreed to
      # run alongside us. The forbidden list is made unlandable rather than
      # discouraged. See docs/2.0/SNAPSHOT.md sections 1 and 4 - and note that this
      # comment does not name the commands, because ci.yml is deliberately NOT on
      # the guard's allowlist: an executable file that can name one can run one.
      - name: Redis safety (shared managed store)
        run: node scripts/check-redis-safety.mjs

      # HANDOFF-06 widened the pool model from two to four. A field still typed as
      # the old sapling-or-orchard pair cannot hold a Sprout or Ironwood value, and
      # it fails by silently dropping one rather than by refusing it, which is the
      # kind of defect that reads as "that pool had no activity". The detector is
      # self-tested in both directions on every run, so a clean scan is evidence
      # rather than the absence of it. See A7.
      - name: Pool union (no stale two-pool unions)
        run: node scripts/check-pool-union.mjs

      # A constant in activation-heights.ts is a chain parameter whose provenance
      # is a line number in the research corpus, and a line number decays the
      # moment anyone inserts a paragraph above it. HANDOFF-07 decayed one inside
      # the commit that wrote it - it added a table to the corpus and re-pinned
      # eight citations by arithmetic instead of by reading - and a gate round
      # found it pointing at a blank line. Nothing else would have: a wrong line
      # number compiles and the suite stays green.
      - name: Corpus citations (no citation points at nothing)
        run: node scripts/check-corpus-citations.mjs

      # A discriminated union's exhaustiveness check protects the SET of variants
      # and says nothing about the SHAPE of one. HANDOFF-08 added a field to the
      # `conservation` variant's params and left its only renderer summing two of
      # the three rejection counts, so a window in which two links were refused
      # rendered "Nothing was refused" - with countIn 3 and countOut 1 on the
      # same record. `tsc` was silent because reading two fields of three is
      # legal. This also stands in for a test that cannot exist: legacy/dashboard
      # has no test script, so that fix shipped with no fail-side transcript.
      - name: Audit consumers (no partial read of a variant's params)
        run: node scripts/check-audit-consumers.mjs

      # A gate finding that names several sites is not closed until every site
      # is. CLAUDE.md has said so since LEDGER-03 Q3 and this session then broke
      # it five times in one handoff, the fifth inside the commit that fixed the
      # fourth. A rule an agent has violated more often than it has honoured is
      # evidence about the instrument, so the finding's site list is now data.
      - name: Finding sites (a multi-site finding is closed at every site)
        run: node scripts/check-finding-sites.mjs

      # HANDOFF-10's three. Dependency-free node, like the seven above, so they
      # keep the same position: a PR whose build breaks still gets their verdict.
      #
      # The compose one matters most of the three. It proves that the managed
      # Redis TCP URL reaches the publisher service and nothing else, reading the
      # variable NAMES out of docs/2.0/SNAPSHOT.md section 3 rather than from a
      # list retyped into the script - because a retyped list is how this
      # repository came to state three variable names that Vercel injects under
      # none of them, in thirteen places.
      - name: Compose (healthchecks, no literal secrets, managed-store scope)
        run: node scripts/check-compose.mjs

      # Every Zebra config section is serde(deny_unknown_fields), so a misspelled
      # key is a node that starts, exits, and is restarted forever with the
      # reason in a log nobody is reading yet. This also cross-checks the health
      # port, state directory and config path against docker-compose.yml, each of
      # which is correct alone and wrong together if one moves.
      - name: Zebra config (parses, known keys, agrees with compose)
        run: node scripts/check-zebrad-config.mjs

      # The runbook is executed by a human against a production box, so a section
      # that reads as complete and carries no command is a real failure. This
      # also asserts that DEPLOY-2.0.md names every variable apps/web reads.
      - name: Infra docs (runbook commands, deploy variables)
        run: node scripts/check-infra-docs.mjs

      # Two branches append a section 8 block to LEDGER.md in the same
      # revolution - that is the protocol, not a mistake - and a three-way merge
      # handed two blocks at one anchor separates a HEADING from the block it
      # names. PR #43's merge did exactly that: nothing was lost and everything
      # was filed under the wrong handoff, in a file whose entire purpose is
      # that the next session reads it by handoff number.
      - name: Ledger structure (no heading separated from its block)
        run: node scripts/check-ledger-structure.mjs

      # packages/zec-instruments exists for exactly one reason: the publisher's
      # image carries no compiler and its runtime opens no sockets, so it cannot
      # depend on apps/indexer, which pulls zeromq (a native addon) and whose
      # entry point starts a ZMQ subscriber. HANDOFF-09 spent a whole handoff
      # publishing four null analysis panels for want of that split. The
      # constraint is checked as a GRAPH rather than trusted as a comment,
      # transitively, because the edge that matters is the one nobody adds
      # directly.
      - name: Instrument package dependency graph (no zeromq, no indexer)
        run: node scripts/check-instrument-deps.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint


      # Must precede the tests. The integration suites probe for a reachable database,
      # not for migrated tables: an unmigrated-but-reachable Postgres unskips all 60
      # and then fails on missing relations. (37 before HANDOFF-06, which added the
      # A6 conservation property and the A2/A3 migration suite; 56 before HANDOFF-07,
      # which added the first suite this project has had over `leak_reports`.)
      - name: Migrate database
        run: pnpm --filter @zcashreveal/indexer migrate

      - name: Test - apps/indexer (vitest run, Postgres-backed)
        run: >-
          pnpm --filter @zcashreveal/indexer exec
          vitest run --reporter=default --reporter=json --outputFile=../../indexer-results.json

      # vitest exits 0 when the integration suites skip themselves, so a broken
      # DATABASE_URL would otherwise produce a green run with 60 fewer tests. See A5,
      # and A1 in HANDOFF-06, whose fail side is exactly this: vitest stays green and
      # rc=0 while this script goes rc=1 and names every skipped test.
      - name: Assert Postgres integration tests actually ran
        run: node scripts/assert-no-skipped-integration.mjs indexer-results.json

      - name: Test - apps/gateway (vitest run)
        run: pnpm --filter @zcashreveal/gateway exec vitest run

      # apps/publisher arrives in HANDOFF-09, and this is the step the redis:7
      # service above exists for. Only A7's sink suite touches that service; the
      # cadence, the three-command count, the key prefix and the budget refusal
      # are unit tests over a spy, because counting commands against a real
      # server would prove less and cost more.
      - name: Test - apps/publisher (vitest run, Redis-backed)
        run: pnpm --filter @zcashreveal/publisher exec vitest run

      # apps/web arrives in HANDOFF-01. Its unit suite covers the seeded RNG,
      # the zatoshi formatters and assertion A2's token check, and none of it
      # was gated before this step existed: pnpm build, typecheck and lint do
      # not run vitest. The Playwright suite carrying A4-A7 needs a browser
      # download and is not wired in here; see the HANDOFF-01 ledger block.
      - name: Test - apps/web (vitest run)
        run: pnpm --filter @zcashreveal/web exec vitest run

      # packages/zebra-rpc HAS NEVER BEEN IN CI, and HANDOFF-08 found it by
      # reading a green run's own log rather than by a failure. The package
      # arrived in HANDOFF-05 with the typed, zod-validated Zebra client, its 35
      # tests were never added here, and every run since has reported a total 35
      # lower than `pnpm -r test` - so CI has been WEAKER than the six-command
      # gate CLAUDE.md tells a contributor to run locally, which is the wrong way
      # round for the check that guards `main`.
      #
      # What it covers is the RPC BOUNDARY: the schemas that decide how the wire
      # is read. That is the layer whose casing defect made every wallet
      # fingerprint inert for the life of this project (`expiryheight`,
      # HANDOFF-05), and the layer HANDOFF-08 changed again in removing
      # `finalironwoodroot` and typing `trees`. A boundary change landing with no
      # CI coverage is the same shape as the fixture that agreed with the
      # interface and disagreed with the wire.
      - name: Test - packages/zebra-rpc (vitest run)
        run: pnpm --filter @zcashreveal/zebra-rpc exec vitest run

      - name: Test - packages/content (vitest run)
        run: pnpm --filter @zcashreveal/content exec vitest run

      # The gate on the seeds themselves: counts, schema, source resolution,
      # lastVerified bounds and quarantine leakage. Unconditional since HANDOFF-02.
      - name: Validate content package
        run: pnpm --filter @zcashreveal/content validate

      # No source may be cited that is not in docs/2.0/research.
      - name: Content provenance
        run: pnpm --filter @zcashreveal/content check:provenance

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: indexer-vitest-report
          path: indexer-results.json
          if-no-files-found: ignore
